x-milvus-image: &milvus-image milvusdb/milvus:v3.0.3

services:
  # 1. Base de datos Vectorial para el RAG
  milvus-volume-init:
    image: *milvus-image
    user: "0:0"
    network_mode: none
    read_only: true
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        uid="$$(id -u milvus)"
        gid="$$(id -g milvus)"
        marker="/var/lib/milvus/.milvus-volume-owner-$${uid}-$${gid}"
        if [ ! -e "$${marker}" ]; then
          echo "Preparing /var/lib/milvus for $${uid}:$${gid}"
          chown -R "$${uid}:$${gid}" /var/lib/milvus
          touch "$${marker}"
          chown "$${uid}:$${gid}" "$${marker}"
        fi
    volumes:
      - ./volumes/milvus:/var/lib/milvus

  # --- DEPENDENCIAS DE MILVUS ---
  #--- etcd - sistema de almacenamiento de metadatos para Milvus ---
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 20s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - red-asistente

  #--- MinIO - almacenamiento de objetos para Milvus ---
  minio:
    container_name: milvus-minio
    image: milvusdb/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - ./volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 20s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - red-asistente

  # --- MILVUS STANDALONE ---
  standalone:
    container_name: milvus-standalone
    image: *milvus-image
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      milvus-volume-init:
        condition: service_completed_successfully
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - red-asistente

  # 2. Servidor de inferencia pesado (Generador local, solo con GPU NVIDIA)
  vllm-server:
    container_name: vllm-server
    image: vllm/vllm-openai:latest
    profiles: ["vllm-activo"]
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    shm_size: '8gb'  # Evitar cuelgues en vLLM
    # Las variables las expande el shell DENTRO del contenedor ($$ = $ literal para Compose),
    # así salen del ../.env cargado con env_file y Compose no necesita interpolar nada.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        exec vllm serve "$${VLLM_MODELO:-Qwen/Qwen2.5-7B-Instruct}"
        --dtype half
        --gpu-memory-utilization "$${VLLM_GPU_UTIL:-0.6}"
        --max-model-len "$${VLLM_MAX_MODEL_LEN:-8192}"
    networks:
      - red-asistente

  # 3. Servidor de inferencia ligero (Enrutador local) — en CPU
  ollama-server:
    container_name: ollama-server
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    env_file:
      - ../.env
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - red-asistente

  # 4. Aplicación multiagente principal
  cookingaura-app-backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cookingaura-app-backend
    ports:
      - "8080:8080"
    env_file:
      - ../.env
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ../backend/src:/app/src
      - ../data:/app/data
      - ../.env:/app/.env
      - ../config:/app/config
      - ../metricas:/app/metricas
      - ~/.cache/huggingface:/root/.cache/huggingface
    depends_on:
      standalone:
        condition: service_healthy   # espera a que Milvus responda en /healthz
      ollama-server:
        condition: service_started
    networks:
      - red-asistente
    command: uvicorn src.main:app --host 0.0.0.0 --port 8080 --reload

  cookingaura-app-frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cookingaura-app-frontend
    ports:
      - "8501:8501"
    env_file:
      - ../.env
    volumes:
      - ../frontend:/app
    depends_on:
      - cookingaura-app-backend
    networks:
      - red-asistente
    command: streamlit run app_cookingaura.py --server.port 8501 --server.address 0.0.0.0

volumes:
  ollama_data:

networks:
  red-asistente:
    driver: bridge